<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रामचरितमानस</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="audioControl" class="audio-control" onclick="toggleAudio()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </div>

    <div id="backgroundAudioControl" class="background-audio-control" onclick="toggleBackgroundAudio()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </div>

    <audio id="backgroundAudio" loop>
        <source src="audio/fullpageauido.mp3" type="audio/mp3">
    </audio>

    <div class="cover" id="cover">
        <video autoplay loop muted>
          <source src="sprite/coverpage2.mp4" type="video/mp4">
        </video>
        <button onclick="startReading()">पढ़ना शुरू करें</button>
    </div>

    <div class="heading" id="heading">बाल कांड</div>

    <div class="book">
        <div class="page" id="leftPage"></div>
        <div class="page" id="rightPage"></div>
    </div>

    <div class="nav-button left-button" onclick="prevPage()">&#9664;</div>
    <div class="nav-button right-button" onclick="nextPage()">&#9654;</div>

    <div class="page-selector">
        <input type="number" id="pageInput" min="1" max="10">
        <button onclick="jumpToPage()">Go</button>
    </div>
    <script src="audioData.js"></script>
    <script src="pagesData.js"></script>
    <script src="script.js"></script>
</body>
</html>
